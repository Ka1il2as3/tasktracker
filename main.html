<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>

  <!-- Emoji favicon + theme color -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
  <meta name="theme-color" content="#34a853">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>

    <header>
      <h1>My Task Tracker</h1>
      <p>Organize your day, one task at a time.</p>
    </header>

    <!-- Circular progress ring -->
    <div class="progress-wrapper">
      <svg class="progress-ring" width="90" height="90" viewBox="0 0 90 90">
        <circle class="ring-bg" cx="45" cy="45" r="38" />
        <circle class="ring-fill" cx="45" cy="45" r="38" id="progress-ring-fill" />
      </svg>
      <span class="progress-label" id="progress-percent">0%</span>
    </div>

    <form id="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        aria-label="Enter a task"
        maxlength="200"
      >
      <button type="submit">Add Task</button>
    </form>

    <section class="stats">
      <p>Total Tasks: <strong id="total-count">0</strong></p>
      <p>Completed: <strong id="completed-count">0</strong></p>
      <p>Pending: <strong id="pending-count">0</strong></p>
    </section>

    <nav class="filters" aria-label="Filter tasks">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="pending">Pending</button>
      <button type="button" data-filter="completed">Completed</button>
    </nav>

    <p id="message" role="status" aria-live="polite"></p>
    <ul id="task-list"></ul>
  </main>

  <!-- Toast notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script src="logic.js"></script>
</body>
</html>
